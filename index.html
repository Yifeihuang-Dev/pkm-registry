<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PKM Hub</title>
<style>
  :root {
    --bg: #10141e; --bg2: #171c28; --line: #262d3d;
    --text: #e8ecf4; --dim: #8b94a8; --teal: #3fd0c9; --teal-dim: #2a8f8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font: 15px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { padding: 56px 24px 28px; text-align: center;
           background: radial-gradient(600px 220px at 50% 0%, #16303a 0%, transparent 70%); }
  header h1 { font-size: 28px; letter-spacing: 4px; }
  header h1 span { color: var(--teal); }
  header p { color: var(--dim); margin-top: 8px; font-size: 13px; }
  .search { margin: 20px auto 0; display: flex; max-width: 520px; }
  .search input { flex: 1; background: var(--bg2); border: 1px solid var(--line);
                  color: var(--text); padding: 12px 16px; border-radius: 8px;
                  font: inherit; outline: none; }
  .search input:focus { border-color: var(--teal-dim); }
  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }
  .stats { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .pkg { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
         margin-bottom: 14px; padding: 16px 18px; cursor: pointer;
         transition: border-color .15s; }
  .pkg:hover { border-color: var(--teal-dim); }
  .pkg .row1 { display: flex; align-items: baseline; gap: 10px; }
  .pkg .name { font-size: 17px; color: var(--teal); font-weight: bold; }
  .pkg .latest { color: var(--dim); font-size: 12px; }
  .pkg .install { margin-left: auto; color: var(--dim); font-size: 12px; }
  .pkg .install code { color: var(--text); background: #0c1018; padding: 3px 8px;
                       border-radius: 5px; border: 1px solid var(--line); }
  .pkg .detail { display: none; margin-top: 14px; border-top: 1px solid var(--line);
                 padding-top: 12px; font-size: 13px; }
  .pkg.open .detail { display: block; }
  .ver { display: flex; gap: 14px; padding: 6px 0; color: var(--dim); flex-wrap: wrap; }
  .ver b { color: var(--text); font-weight: normal; }
  .ver .sha { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 30px 0 40px; }
  footer a { color: var(--teal-dim); text-decoration: none; }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; }
</style>
</head>
<body>
<header>
  <h1>PKM <span>HUB</span></h1>
  <p>signed .pkm packages — verify first, trust on first use, code as-is</p>
  <div class="search"><input id="q" placeholder="search packages… (try: log, utils, tools)"></div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div id="list"></div>
</main>
<footer>
  browse: <a href="index.json">index.json</a> ·
  install: <code style="color:var(--text)">pkm source add hub https://yifeihuang-dev.github.io/pkm-registry</code> ·
  powered by <a href="https://github.com/Yifeihuang-Dev/package-manager">pkm</a>
</footer>
<script>
let PACKAGES = {};

async function load() {
  const r = await fetch("index.json");
  const idx = await r.json();
  PACKAGES = idx.packages || {};
  render();
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = document.getElementById("list");
  const names = Object.keys(PACKAGES).filter(n => !q || n.toLowerCase().includes(q));
  const totalVersions = names.reduce((s, n) => s + Object.keys(PACKAGES[n]).length, 0);
  document.getElementById("stats").textContent =
    `${names.length} package(s) · ${totalVersions} version(s) · every package Ed25519-signed`;
  list.innerHTML = "";
  if (!names.length) { list.innerHTML = '<div class="empty">nothing matches</div>'; return; }
  for (const name of names.sort()) {
    const versions = PACKAGES[name];
    const latest = Object.keys(versions).sort().pop();
    const e = versions[latest];
    const div = document.createElement("div");
    div.className = "pkg";
    const rows = Object.keys(versions).sort().reverse().map(v => {
      const en = versions[v];
      return `<div class="ver"><b>v${v}</b>` +
             `<span>sha256 <span class="sha">${(en.sha256||"").slice(0,24)}…</span></span>` +
             `<span>key <b>${en.key_id||"?"}</b></span>` +
             `<span>${en.published_at||""}</span></div>`;
    }).join("");
    div.innerHTML =
      `<div class="row1"><span class="name">${name}</span>` +
      `<span class="latest">v${latest}</span>` +
      `<span class="install">install <code>pkm install ${name}</code></span></div>` +
      `<div class="detail">${rows}` +
      `<div class="ver"><span>stream instead: <b>python -m package_manager.cloud</b> (code never lands on disk)</span></div></div>`;
    div.onclick = () => div.classList.toggle("open");
    list.appendChild(div);
  }
}

document.getElementById("q").addEventListener("input", render);
load();
</script>
</body>
</html>
